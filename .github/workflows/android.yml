name: Android ARM64 APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install tools
        run: |
          if ! command -v glslc >/dev/null; then sudo apt-get update && sudo apt-get install -y glslc; fi
          if ! command -v spirv-as >/dev/null || ! command -v spirv-val >/dev/null; then sudo apt-get update && sudo apt-get install -y spirv-tools; fi
          if ! command -v llvm-mc-18 >/dev/null; then sudo apt-get update && sudo apt-get install -y llvm-18; fi
          python3 tools/generate_isa_reference.py "$(command -v llvm-mc-18)" app/src/main/assets/mgfx2-observed.txt app/src/main/assets/gfx1100-reference.tsv
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          git clone --depth 1 --branch v1.4.321 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          echo "VULKAN_HEADERS=$RUNNER_TEMP/Vulkan-Headers/include" >> "$GITHUB_ENV"
      - name: Test capability classification and registry generator
        run: |
          mkdir -p /tmp/gpulab-test
          javac -d /tmp/gpulab-test app/src/main/java/dev/xclipse/gpulab/{Audit,Kernel,Libraries,Elf,DeepLibraries,Research,ReportBundle,IsaLab,ArchitectureLab,SgpuInspector,FmaLab}.java tests/AuditTest.java tests/ResearchTest.java tests/ReportBundleTest.java tests/IsaLabTest.java tests/ArchitectureLabTest.java tests/SgpuInspectorTest.java tests/KernelTest.java tests/FmaLabTest.java
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.AuditTest
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.ResearchTest
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.ReportBundleTest
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.IsaLabTest
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.ArchitectureLabTest
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.SgpuInspectorTest
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.KernelTest
          java -cp /tmp/gpulab-test dev.xclipse.gpulab.FmaLabTest
          g++ -std=c++17 -O2 -Wall -Wextra -fsanitize=undefined tests/fma_reference_test.cpp -o /tmp/gpulab-test/fma-reference-test
          /tmp/gpulab-test/fma-reference-test
          python3 tools/generate_compute.py "$(command -v glslc)" app/src/main/cpp/probe.comp /tmp/gpulab-test/compute_generated.inc
          python3 tools/generate_registry.py "$VULKAN_HEADERS/../registry/vk.xml" /tmp/gpulab-test/registry.inc
          test -s /tmp/gpulab-test/registry.inc
      - run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Xclipse-GPU-Lab-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
