plugins { id 'com.android.application' }
android {
 namespace 'dev.xclipse.gpulab'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'dev.xclipse.gpulab'
  minSdk 29
  targetSdk 34
  versionCode 6
  versionName '0.6-alpha'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared'; if (System.getenv('VULKAN_HEADERS')) arguments "-DREGISTRY_HEADERS=${System.getenv('VULKAN_HEADERS')}" } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
